<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account — LuxeWood</title>
    <meta name="description" content="Manage your LuxeWood account, profile, and orders.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <div id="page-loader">
        <div class="loader-logo">Luxe<span>Wood</span></div>
        <div class="loader-bar"></div>
    </div>

    <!-- Navbar -->
    <nav class="navbar solid" id="navbar">
        <a href="/" class="nav-logo">Luxe<span>Wood</span></a>
        <div class="nav-links">
            <a href="/">Home</a><a href="/shop">Shop</a>
        </div>
        <div class="nav-actions">
            <button class="nav-icon-btn" id="cart-btn">🛒<span class="cart-badge" id="cart-badge"
                    style="display:none">0</span></button>
            <a href="/login" class="btn btn-primary btn-sm" id="nav-login-link">Sign In</a>
            <a href="/dashboard" class="btn btn-ghost btn-sm active" id="nav-dashboard-link" style="display:none">My
                Account</a>
            <a href="/admin" class="btn btn-outline btn-sm" id="nav-admin-link" style="display:none">Admin</a>
            <button class="btn btn-ghost btn-sm" id="nav-logout-btn" style="display:none"
                onclick="logout()">Logout</button>
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        </div>
    </nav>

    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3><button class="cart-close" id="cart-close">✕</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-subtotal"><span>Subtotal</span><span class="amount" id="cart-subtotal-amount">$0</span>
            </div>
            <a href="/shop" class="btn btn-primary w-full" style="justify-content:center">Checkout →</a>
        </div>
    </div>

    <!-- Dashboard Layout -->
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="dash-sidebar">
            <div class="dash-user-card" id="dash-user-card">
                <div class="dash-avatar" id="dash-avatar">?</div>
                <div class="dash-user-info">
                    <div class="dash-name" id="dash-name">Loading…</div>
                    <div class="dash-email" id="dash-email">—</div>
                </div>
            </div>
            <nav class="dash-nav">
                <a href="#overview" class="dash-nav-item active" data-tab="overview"
                    onclick="switchTab('overview',this)">📊 Overview</a>
                <a href="#orders" class="dash-nav-item" data-tab="orders" onclick="switchTab('orders',this)">📦 My
                    Orders</a>
                <a href="#profile" class="dash-nav-item" data-tab="profile" onclick="switchTab('profile',this)">👤
                    Profile</a>
                <a href="/shop" class="dash-nav-item">🛒 Shop Now</a>
                <button class="dash-nav-item dash-logout" onclick="logout()">🚪 Sign Out</button>
            </nav>
        </aside>

        <!-- Main -->
        <main class="dash-main">
            <!-- Overview Tab -->
            <div class="dash-tab active" id="tab-overview">
                <h2 class="dash-tab-title">Welcome Back, <span id="welcome-name">—</span></h2>
                <div class="dash-stats">
                    <div class="dash-stat-card glass-card">
                        <div class="dsc-icon">📦</div>
                        <div>
                            <div class="dsc-num" id="total-orders">–</div>
                            <div class="dsc-label">Total Orders</div>
                        </div>
                    </div>
                    <div class="dash-stat-card glass-card">
                        <div class="dsc-icon">✅</div>
                        <div>
                            <div class="dsc-num" id="delivered-orders">–</div>
                            <div class="dsc-label">Delivered</div>
                        </div>
                    </div>
                    <div class="dash-stat-card glass-card">
                        <div class="dsc-icon">💰</div>
                        <div>
                            <div class="dsc-num" id="total-spent">–</div>
                            <div class="dsc-label">Total Spent</div>
                        </div>
                    </div>
                </div>
                <h3 class="dash-section-title">Recent Orders</h3>
                <div id="recent-orders-list"></div>
            </div>

            <!-- Orders Tab -->
            <div class="dash-tab" id="tab-orders">
                <h2 class="dash-tab-title">My Orders</h2>
                <div id="all-orders-list"></div>
            </div>

            <!-- Profile Tab -->
            <div class="dash-tab" id="tab-profile">
                <h2 class="dash-tab-title">My Profile</h2>
                <div class="profile-card glass-card">
                    <form id="profile-form">
                        <div class="form-row-2">
                            <div class="form-group">
                                <label class="form-label">Full Name</label>
                                <input type="text" id="pf-name" class="form-control" placeholder="Jane Smith">
                            </div>
                            <div class="form-group">
                                <label class="form-label">Email Address</label>
                                <input type="email" id="pf-email" class="form-control" disabled>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" id="pf-phone" class="form-control" placeholder="+1 (555) 000-0000">
                        </div>
                        <div class="form-group">
                            <label class="form-label">Shipping Address</label>
                            <textarea id="pf-address" class="form-control" rows="3"
                                placeholder="42 Main St, Brooklyn, NY 11201"></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </form>
                </div>
            </div>
        </main>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/dashboard.js"></script>
</body>

</html>

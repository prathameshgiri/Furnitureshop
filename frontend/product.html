<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product — LuxeWood</title>
    <meta name="description" content="View product details and add to cart.">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/product.css">
</head>

<body>
    <div id="page-loader">
        <div class="loader-logo">Luxe<span>Wood</span></div>
        <div class="loader-bar"></div>
    </div>
    <nav class="navbar solid" id="navbar">
        <a href="/" class="nav-logo">Luxe<span>Wood</span></a>
        <div class="nav-links">
            <a href="/">Home</a><a href="/shop" class="active">Shop</a>
        </div>
        <div class="nav-actions">
            <button class="nav-icon-btn" id="cart-btn">🛒<span class="cart-badge" id="cart-badge"
                    style="display:none">0</span></button>
            <a href="/login" class="btn btn-primary btn-sm" id="nav-login-link">Sign In</a>
            <a href="/dashboard" class="btn btn-ghost btn-sm" id="nav-dashboard-link" style="display:none">My
                Account</a>
            <a href="/admin" class="btn btn-outline btn-sm" id="nav-admin-link" style="display:none">Admin</a>
            <button class="btn btn-ghost btn-sm" id="nav-logout-btn" style="display:none"
                onclick="logout()">Logout</button>
            <button class="hamburger" id="hamburger"><span></span><span></span><span></span></button>
        </div>
    </nav>
    <!-- Mobile Nav Backdrop -->
    <div class="mobile-nav-backdrop" id="mobile-nav-backdrop"></div>
    <!-- Mobile Nav -->
    <div class="mobile-nav" id="mobile-nav">
        <a href="/">🏠 Home</a>
        <a href="/shop">🛋 Shop</a>
        <hr class="mobile-nav-divider">
        <a href="/login" id="mobile-login">🔑 Sign In</a>
        <a href="/dashboard" id="mobile-dashboard" style="display:none">👤 My Account</a>
        <a href="/admin" id="mobile-admin" style="display:none">⚙️ Admin Panel</a>
        <button id="mobile-logout" class="mobile-nav-logout" style="display:none" onclick="logout()">🚪 Sign
            Out</button>
    </div>
    <div class="cart-overlay" id="cart-overlay"></div>
    <div class="cart-sidebar" id="cart-sidebar">
        <div class="cart-header">
            <h3>Your Cart</h3><button class="cart-close" id="cart-close">✕</button>
        </div>
        <div class="cart-items" id="cart-items"></div>
        <div class="cart-footer">
            <div class="cart-subtotal"><span>Subtotal</span><span class="amount" id="cart-subtotal-amount">₹0</span>
            </div>
            <a href="/shop" class="btn btn-primary w-full" style="justify-content:center">Checkout →</a>
        </div>
    </div>

    <!-- Breadcrumb -->
    <div class="breadcrumb-bar">
        <div class="container">
            <a href="/">Home</a> <span>/</span> <a href="/shop">Shop</a> <span>/</span> <span
                id="bc-name">Product</span>
        </div>
    </div>

    <!-- Product Detail -->
    <main class="product-detail container" id="product-detail">
        <!-- Populated by JS -->
        <div class="pd-skeleton">
            <div class="skeleton skeleton-img" style="aspect-ratio:1;border-radius:var(--radius-lg)"></div>
            <div style="padding:2rem">
                <div class="skeleton skeleton-line w-40" style="height:12px;margin-bottom:16px"></div>
                <div class="skeleton skeleton-line w-80" style="height:28px;margin-bottom:12px"></div>
                <div class="skeleton skeleton-line w-60" style="height:12px;margin-bottom:24px"></div>
                <div class="skeleton skeleton-line w-40" style="height:36px;margin-bottom:24px"></div>
                <div class="skeleton skeleton-line w-full" style="height:12px;margin-bottom:8px"></div>
                <div class="skeleton skeleton-line w-full" style="height:12px;margin-bottom:8px"></div>
                <div class="skeleton skeleton-line w-80" style="height:12px;margin-bottom:32px"></div>
                <div class="skeleton skeleton-line w-60" style="height:52px;border-radius:999px"></div>
            </div>
        </div>
    </main>

    <!-- Customer Reviews (populated by product.js) -->
    <section class="reviews-section" id="reviews-section"></section>

    <!-- Related Products -->
    <section class="section" style="background:var(--clr-beige)">
        <div class="container">
            <h2 class="section-title text-center reveal mb-lg" style="margin-bottom:var(--space-xl)">You May Also Like
            </h2>
            <div class="products-grid" id="related-grid"></div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <div class="footer-bottom">
                <p>&copy; 2026 LuxeWood. All rights reserved.</p>
                <p style="color:var(--clr-brown);font-weight:600">Designed &amp; Developed by Alfiya Ekambe 🎨</p>
            </div>
        </div>
    </footer>

    <script src="/js/app.js"></script>
    <script src="/js/product.js"></script>
</body>

</html>
